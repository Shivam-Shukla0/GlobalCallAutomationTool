# Render blueprint — deploys the web app + a managed Postgres database.
# In Render: New + -> Blueprint -> connect this repo. Render reads this file.
# NOTE: free Postgres expires ~30 days; switch `plan: free` -> `starter` for real use.

databases:
  - name: call-automation-db
    databaseName: call_automation
    user: cas
    plan: free

services:
  - type: web
    name: call-automation
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -e '.[postgres]'"
    # Run migrations + ensure admin exists, then start gunicorn. Idempotent on redeploys.
    startCommand: >-
      sh -c "flask db upgrade &&
             flask create-admin || true &&
             gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: FLASK_APP
        value: wsgi:app
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Auto-generated strong secret
      - key: SECRET_KEY
        generateValue: true
      # Wired automatically from the database above
      - key: DATABASE_URL
        fromDatabase:
          name: call-automation-db
          property: connectionString
      # Redis empty -> memory rate limiter, in-process dialer (no Celery needed)
      - key: REDIS_URL
        value: ""
      # ---- Fill these in the Render dashboard (sync:false = secret, not in git) ----
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL          # set to your https://<app>.onrender.com after first deploy
        sync: false
      - key: FORWARD_TO_NUMBER
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD           # set a strong password here
        sync: false
      # ---- Calling policy / compliance ----
      - key: CALLING_TIMEZONE
        value: Asia/Kolkata
      - key: CALLING_REGION
        value: IN
      - key: CALLING_WINDOW_START
        value: "09:00"
      - key: CALLING_WINDOW_END
        value: "20:00"
